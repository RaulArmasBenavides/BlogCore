version: '3.4'

networks:
  backend:
    name: blogcore-network

services:
  db:
    build: 
      context: ./scripts/sql
    image: mcr.microsoft.com/mssql/server
    container_name: blogcore-db
    environment:
      MSSQL_SA_PASSWORD: "P@ssw0rd?"
      ACCEPT_EULA: "Y"
    ports:
      - "11433:1433"
    networks:
      - backend
    volumes:
      - sql_data:/var/opt/mssql
  blogcore:
    image: ${DOCKER_REGISTRY-}blogcore
    build:
      context: .        
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      ConnectionStrings__ConexionSQL: "Server=db,1433;Database=CONSULTORIO2;User Id=sa;Password=P@ssw0rd?;Encrypt=False"
    depends_on:
      - db
    networks:
      - backend


volumes:
  sql_data: